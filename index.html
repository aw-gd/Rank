<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片强度排行榜</title>
    
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        
        .header-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        h1 { font-size: 20px; color: #333; }
        
        .btn-group { display: flex; gap: 10px; }
        .share-btn { background-color: #1e88e5; color: white; border: none; padding: 10px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .debug-btn { background-color: #ff9800; color: white; border: none; padding: 10px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }

        .tier-container { display: flex; flex-direction: column; width: 100%; max-width: 900px; background-color: #b0b0b0; border: 2px solid #333; border-radius: 8px; overflow: hidden; }
        .tier-row { display: flex; min-height: 60px; border-bottom: 2px solid #333; }
        .tier-row:last-child { border-bottom: none; }
        .tier-label { width: 90px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #000; border-right: 2px solid #333; flex-shrink: 0; text-align: center; padding: 5px; }
        
        .color-hang { background-color: #d32f2f; color: white; }
        .color-top { background-color: #e5b968; }
        .color-human { background-color: #ffeb3b; }
        .color-npc { background-color: #fdf2d0; }
        .color-pull { background-color: #e0e0e0; }

        .tier-dropzone { flex-grow: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 8px; background-color: #cfcfcf; min-height: 60px; }
        .pool-container { margin-top: 15px; width: 100%; max-width: 900px; background-color: #e0e0e0; border: 2px dashed #999; border-radius: 8px; padding: 10px; min-height: 60px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
        
        .drag-item { 
            border-radius: 6px; 
            background-color: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            cursor: grab; 
            touch-action: none; 
            min-width: 20px;
            min-height: 20px;
        }
        .drag-item:active { cursor: grabbing; opacity: 0.8; }
        
        .debug-msg { color: red; font-weight: bold; padding: 10px; width: 100%; background: white; border: 1px solid red; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>图片强度排行榜</h1>
        <div class="btn-group">
            <button class="debug-btn" onclick="testImageUrl()">Test Image Link</button>
            <button class="share-btn" id="shareBtn">📸 分享截图</button>
        </div>
    </div>

    <div id="captureArea" style="background-color: #f0f2f5; padding: 10px; border-radius: 8px; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="tier-container">
            <div class="tier-row"><div class="tier-label color-hang">夯</div><div class="tier-dropzone"></div></div>
            <div class="tier-row"><div class="tier-label color-top">顶级</div><div class="tier-dropzone"></div></div>
            <div class="tier-row"><div class="tier-label color-human">人上人</div><div class="tier-dropzone"></div></div>
            <div class="tier-row"><div class="tier-label color-npc">NPC</div><div class="tier-dropzone"></div></div>
            <div class="tier-row"><div class="tier-label color-pull">拉完了</div><div class="tier-dropzone"></div></div>
        </div>
        <div class="pool-container" id="imagePool"></div>
    </div>

    <script>
        const pool = document.getElementById('imagePool');
        const dropzones = document.querySelectorAll('.tier-dropzone, .pool-container');
        let draggedItem = null;

        // Drag & Drop Logic
        function makeDraggable(item) {
            item.addEventListener('dragstart', (e) => {
                draggedItem = item;
                setTimeout(() => item.style.opacity = '0.5', 0);
                e.dataTransfer.setData('text/plain', ''); 
            });
            item.addEventListener('dragend', () => {
                item.style.opacity = '1';
                draggedItem = null;
            });
            item.addEventListener('touchstart', (e) => {
                draggedItem = item;
                item.style.opacity = '0.5';
                e.preventDefault();
            }, { passive: false });
            item.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.closest('.tier-dropzone, .pool-container')) {
                    const zone = target.closest('.tier-dropzone, .pool-container');
                    zone.style.backgroundColor = '#e6f7ff';
                }
            }, { passive: false });
            item.addEventListener('touchend', (e) => {
                item.style.opacity = '1';
                const touch = e.changedTouches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                dropzones.forEach(z => z.style.backgroundColor = '');
                if (target && target.closest('.tier-dropzone, .pool-container')) {
                    const zone = target.closest('.tier-dropzone, .pool-container');
                    zone.appendChild(draggedItem);
                }
                draggedItem = null;
            });
        }

        dropzones.forEach(zone => {
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.backgroundColor = '#e6f7ff'; });
            zone.addEventListener('dragleave', () => { zone.style.backgroundColor = ''; });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.style.backgroundColor = '';
                if (draggedItem) zone.appendChild(draggedItem);
            });
        });

        // Image Loading
        function createImage(src) {
            const img = document.createElement('img');
            img.classList.add('drag-item');
            img.draggable = true;
            makeDraggable(img);
            img.onload = function() {
                this.style.width = (this.naturalWidth * 0.5) + 'px';
                this.style.height = (this.naturalHeight * 0.5) + 'px';
            };
            img.src = src;
            pool.appendChild(img);
        }

        // ⚠️ CHECK THIS URL: If your branch is 'master', change 'main' to 'master'
        const baseUrl = "https://raw.githubusercontent.com/aw-gd/Rank/main/";
        let currentNumber = 1;
        let foundCount = 0;

        function loadNextImage() {
            const img = new Image();
            img.src = `${baseUrl}${currentNumber}.webp`;
            
            img.onload = function() {
                createImage(img.src);
                foundCount++;
                currentNumber++;
                loadNextImage(); 
            };
            img.onerror = function() {
                img.src = `${baseUrl}${currentNumber}.jpg`;
                img.onload = function() {
                    createImage(img.src);
                    foundCount++;
                    currentNumber++;
                    loadNextImage();
                };
                img.onerror = function() {
                    if (foundCount === 0) {
                        pool.innerHTML = '<div class="debug-msg">⚠️ Failed to load 1.webp or 1.jpg. Click "Test Image Link" above to see the error.</div>';
                    }
                };
            };
        }

        // 🚨 DEBUG FUNCTION
        function testImageUrl() {
            const url = `${baseUrl}1.webp`;
            const win = window.open(url, '_blank');
            if (!win) {
                alert("Pop-up blocked. Please allow pop-ups to test the link. The link is:\n\n" + url);
            }
        }

        // Screenshot
        document.getElementById('shareBtn').addEventListener('click', async () => {
            const btn = document.getElementById('shareBtn');
            btn.innerText = 'Processing...';
            btn.disabled = true;
            try {
                const canvas = await html2canvas(document.getElementById('captureArea'), { backgroundColor: '#f0f2f5', scale: 2, useCORS: true });
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], 'tier.png', { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: 'Tier List' }); } catch (e) {}
                    } else {
                        const link = document.createElement('a');
                        link.download = 'tier.png';
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    }
                    btn.innerText = '📸 分享截图';
                    btn.disabled = false;
                }, 'image/png');
            } catch (e) {
                alert("Screenshot failed");
                btn.innerText = '📸 分享截图';
                btn.disabled = false;
            }
        });

        window.onload = () => { loadNextImage(); };
    </script>
</body>
</html>
